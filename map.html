<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Фото-карта</title>
<style>
*{box-sizing:border-box}html,body,#map{width:100%;height:100%;margin:0;font:14px system-ui,Arial,sans-serif}#map{position:absolute;inset:0}.toolbar{position:absolute;z-index:500;top:14px;left:14px;display:flex;gap:8px;align-items:center;padding:10px 12px;background:#fff;border-radius:12px;box-shadow:0 3px 18px #0003}.toolbar input{width:90px;padding:8px;border:1px solid #ccd2dc;border-radius:7px}.toolbar button{padding:8px 12px;border:0;border-radius:7px;background:#5144bd;color:#fff;cursor:pointer}.toolbar label{display:flex;align-items:center;gap:6px}.status{position:absolute;z-index:600;left:50%;top:50%;transform:translate(-50%,-50%);max-width:min(540px,90vw);padding:18px 22px;background:#202431;color:white;border-radius:12px;box-shadow:0 5px 25px #0004;text-align:center}.status.error{background:#7c2525}.balloon{max-width:300px;overflow-wrap:anywhere;line-height:1.55}.balloon a{color:#185abc}.legend{font-size:12px;color:#555}.fake{color:#a65c00}.thumb-preview{position:absolute;z-index:700;pointer-events:none;background:#fff;border-radius:10px;box-shadow:0 8px 28px #0005;padding:6px;max-width:220px}.thumb-preview img{display:block;max-width:208px;max-height:208px;border-radius:6px;object-fit:contain;background:#f1f3f7}.thumb-preview .caption{margin-top:4px;font-size:12px;color:#3b4252;max-width:208px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spread-chip{width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:9px;overflow:hidden;border:2px solid #fff;box-shadow:0 3px 10px #0005;background:#e9edf5;cursor:pointer;transition:transform .12s,box-shadow .12s,border-color .12s}
.spread-chip img{width:100%;height:100%;object-fit:cover;display:block}
.spread-chip:hover{transform:scale(1.18);box-shadow:0 6px 16px #0006;border-color:#5144bd}
.spread-dot{width:25px;height:25px;margin:-12.5px 0 0 -12.5px;border-radius:50%;background:#5144bd;border:2px solid #fff;box-shadow:0 2px 8px #0005;cursor:pointer;transition:transform .12s}
.spread-dot:hover{transform:scale(1.3);background:#3f34a0}
.map-toast{position:absolute;z-index:800;left:50%;bottom:24px;transform:translateX(-50%);background:#202431e8;color:#fff;padding:9px 15px;border-radius:9px;font-size:13px;box-shadow:0 4px 18px #0004;pointer-events:none}
</style>
<script src="https://api-maps.yandex.ru/2.1/?lang=ru_RU"></script>
</head><body>
<div id="map"></div><div class="toolbar"><label>Год <input id="year" type="text" inputmode="numeric" placeholder="например 2024"></label><button id="load">Загрузить</button><span class="legend">● GPS &nbsp; ◉ приблизительная точка</span></div><div id="status" class="status">Инициализация карты…</div>
<script>
'use strict';
const status=document.getElementById('status'); let map, clusterer, lineLayer, loadRequest=0;
let currentPoints=[], currentPaths=[], currentYear='', activeIndex=-1, cursorX=0, cursorY=0, previewEl=null;
// Псевдоразнесение кластера: до 30 миниатюр по трём кольцам вокруг центра группы.
const SPREAD_LIMIT=30, SPREAD_RINGS=[[52,8],[96,12],[140,10]];
let spreadLayer=null, spreadTimer=null, spreadCluster=null, toastEl=null, toastTimer=null;
function message(text,error=false){status.textContent=text;status.classList.toggle('error',error);status.hidden=false}
function clearStatus(){status.hidden=true}
function safeUrl(path){return path.split('/').map(encodeURIComponent).join('/')}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function validPoint(p){return p&&Number.isFinite(Number(p.lat))&&Number.isFinite(Number(p.lon))&&Math.abs(Number(p.lat))<=90&&Math.abs(Number(p.lon))<=180}
function init(){
 map=new ymaps.Map('map',{center:[55.75,37.61],zoom:5,controls:['zoomControl','fullscreenControl']},{suppressMapOpenBlock:true});
 THUMB_CHIP_LAYOUT=ymaps.templateLayoutFactory.createClass('<div class="spread-chip"><img src="{{ properties.thumb }}" alt=""></div>');
 DOT_CHIP_LAYOUT=ymaps.templateLayoutFactory.createClass('<div class="spread-dot"></div>');
 // clusterHasHint:false — подсказка кластера перекрывала бы развёрнутые миниатюры.
 clusterer=new ymaps.Clusterer({preset:'islands#invertedVioletClusterIcons',groupByCoordinates:false,gridSize:64,clusterHasHint:false});
 // У Clusterer нет события mouseenter (есть только hintopen/hintclose и balloonopen/balloonclose),
 // поэтому подписываемся на каждый созданный кластер через документированную точку расширения.
 const baseCreateCluster=ymaps.Clusterer.prototype.createCluster;
 clusterer.createCluster=function(center,geoObjects){
  const cluster=baseCreateCluster.call(this,center,geoObjects);
  try{cluster.properties.set('pointObjects',geoObjects)}catch(e){}
  cluster.events.add('mouseenter',()=>showSpread(cluster));
  cluster.events.add('mouseleave',scheduleCollapse);
  return cluster;
 };
 // clusterer.events наведения не эмитит, поэтому подписки здесь нет.
 // При смене масштаба или сдвиге карты разнесённые метки устаревают.
 map.events.add('boundschange',clearSpread);
 lineLayer=new ymaps.GeoObjectCollection();map.geoObjects.add(lineLayer);
 document.getElementById('load').addEventListener('click',loadYear);
 document.getElementById('year').addEventListener('keydown',e=>{if(e.key==='Enter')loadYear()});
 const params=new URLSearchParams(location.search);document.getElementById('year').value=params.get('year')||new Date().getFullYear();loadYear();
}
async function loadYear(){
 const requestId=++loadRequest;
 const year=document.getElementById('year').value.trim();if(!/^\d{4}$/.test(year)&&year!=='unknown'){message('Укажите год в формате YYYY или unknown.',true);return}
 message(`Загрузка points_${year}.json…`);clearSpread();clusterer.removeAll();lineLayer.removeAll();
 try{
  const response=await fetch(`points_${encodeURIComponent(year)}.json`,{cache:'no-cache'});if(requestId!==loadRequest)return;if(!response.ok)throw new Error(`Не удалось загрузить points_${year}.json (HTTP ${response.status}).`);
  const data=await response.json();if(requestId!==loadRequest)return;if(!data||!Array.isArray(data.points))throw new Error('Некорректный JSON: ожидался объект с массивом points.');
  const points=data.points;const validEntries=points.map((p,index)=>({p,index})).filter(x=>validPoint(x.p));if(!validEntries.length){message('В этом файле нет точек с корректными координатами.');return}
  currentPoints=points;currentPaths=Array.isArray(data.paths)?data.paths:[];currentYear=year;activeIndex=-1;hideThumbPreview();
  const objects=validEntries.map(({index})=>makePlacemark(index,'cluster'));
  clusterer.add(objects);map.geoObjects.add(clusterer);
  // paths содержит индексы точек в массиве points из генератора.
  if(Array.isArray(data.paths))for(const path of data.paths){if(!Array.isArray(path)||path.length<2)continue;const coords=path.map(i=>Number.isInteger(i)?points[i]:null).filter(validPoint).map(p=>[Number(p.lat),Number(p.lon)]);if(coords.length>=2)lineLayer.add(new ymaps.Polyline(coords,{}, {strokeColor:'#5144bd99',strokeWidth:3,strokeOpacity:.55}))}
  const bounds=map.geoObjects.getBounds();if(bounds)map.setBounds(bounds,{checkZoomRange:true,zoomMargin:35});
  history.replaceState(null,'',`?year=${encodeURIComponent(year)}`);message(`Загружено точек: ${validEntries.length}${validEntries.length!==points.length?` (пропущено некорректных: ${points.length-validEntries.length})`:''}.`);setTimeout(clearStatus,2200);
 }catch(e){
  if(requestId!==loadRequest)return;
  let detail=e.message;
  if(/HTTP 404/.test(detail)){
   try{const dir=await fetch('./');if(dir.ok){const html=await dir.text();const available=[...html.matchAll(/href=["'](points_(?:\\d{4}|unknown)\\.json)["']/gi)].map(m=>m[1]);if(available.length)detail+=` Доступные файлы: ${[...new Set(available)].join(', ')}. Введите год из имени файла.`;else detail+=' Проверьте, что скрипт Python уже создал points_<год>.json в этой папке.'}}catch{}
  }
  message(`${detail} Запустите сервер в папке с файлами: python -m http.server 8000`,true);console.error(e)
 }
}
function baseName(path){return String(path||'').split('/').pop()||''}
// Показываем ровно одну миниатюру: своя у точки, иначе первая в псевдопути, иначе случайная за год.
function pickThumb(index){
 const point=currentPoints[index];
 if(point&&point.thumb)return point.thumb;
 for(const path of currentPaths){if(!Array.isArray(path)||!path.includes(index))continue;for(const i of path){const p=currentPoints[i];if(p&&p.thumb)return p.thumb}}
 const candidates=currentPoints.filter(p=>p&&p.thumb);
 if(candidates.length)return candidates[Math.floor(Math.random()*candidates.length)].thumb;
 return null;
}
function previewBox(){if(!previewEl){previewEl=document.createElement('div');previewEl.className='thumb-preview';previewEl.hidden=true;document.getElementById('map').appendChild(previewEl)}return previewEl}
function hideThumbPreview(){if(previewEl)previewEl.hidden=true}
function placePreview(clientX,clientY){
 const el=previewBox(),mapEl=document.getElementById('map'),rect=mapEl.getBoundingClientRect();
 const x=(clientX==null?cursorX:clientX)-rect.left,y=(clientY==null?cursorY:clientY)-rect.top;
 let left=x+18,top=y+18;
 if(left+el.offsetWidth>rect.width)left=x-el.offsetWidth-18;
 if(top+el.offsetHeight>rect.height)top=y-el.offsetHeight-18;
 el.style.left=Math.max(6,left)+'px';el.style.top=Math.max(6,top)+'px';
}
function showThumbPreview(index,clientX,clientY){
 const src=pickThumb(index);if(!src)return;
 const el=previewBox(),img=document.createElement('img'),caption=document.createElement('div');
 img.src=src;img.alt='Миниатюра фотографии';
 caption.className='caption';caption.textContent=baseName(currentPoints[index]&&currentPoints[index].file);
 el.replaceChildren(img,caption);el.hidden=false;placePreview(clientX,clientY);
}
function toast(text){
 const mapEl=document.getElementById('map');
 if(!toastEl){toastEl=document.createElement('div');toastEl.className='map-toast';mapEl.appendChild(toastEl)}
 toastEl.textContent=text;toastEl.hidden=false;
 clearTimeout(toastTimer);toastTimer=setTimeout(()=>{toastEl.hidden=true},2600);
}
// Состав кластера: сначала сохранённый при создании список, затем API-метод.
function clusterObjects(target){
 if(!target||target===clusterer)return null;   // сам кластеризатор — не кластер
 try{const stored=target.properties&&target.properties.get('pointObjects');if(Array.isArray(stored)&&stored.length)return stored}catch(e){}
 try{if(typeof target.getGeoObjects==='function')return target.getGeoObjects()}catch(e){}
 try{const list=target.properties&&target.properties.get('geoObjects');if(Array.isArray(list))return list}catch(e){}
 return null;
}
// Смещение в пикселях экрана -> географические координаты на текущем зуме.
function offsetGeoPoint(geo,dx,dy){
 try{
  const projection=map.options.get('projection'),zoom=map.getZoom();
  const gp=projection.toGlobalPixels(geo,zoom);
  return projection.fromGlobalPixels([gp[0]+dx,gp[1]+dy],zoom);
 }catch(e){}
 try{
  const metersPerPixel=156543.03392*Math.cos(geo[0]*Math.PI/180)/Math.pow(2,map.getZoom());
  const dLat=dy*metersPerPixel/111320;
  const dLon=dx*metersPerPixel/(111320*Math.max(0.2,Math.cos(geo[0]*Math.PI/180)));
  return [geo[0]+dLat,geo[1]+dLon];
 }catch(e){return geo}
}
// Раскладка по кольцам: 8 + 12 + 10 = 30 позиций, начиная сверху, по часовой стрелке.
function spreadOffsets(count){
 const result=[];let left=count;
 for(let ring=0;ring<SPREAD_RINGS.length&&left>0;ring++){
  const [radius,capacity]=SPREAD_RINGS[ring];
  const take=Math.min(capacity,left);
  const step=2*Math.PI/take;
  const shift=ring*Math.PI/take;
  for(let i=0;i<take;i++){const angle=-Math.PI/2+shift+i*step;result.push({radius,angle})}
  left-=take;
 }
 return result;
}
function balloonProps(index){
 const p=currentPoints[index]||{};
 const filename=String(p.file||'');const basename=filename.split('/').pop()||filename;
 const pos=[Number(p.lat),Number(p.lon)];const fake=Boolean(p.fake);
 const pathUrl=`photo-path.html?year=${encodeURIComponent(currentYear)}&index=${index}`;
 return {
  balloonContentHeader:fake?'Приблизительное местоположение':'Фотография',
  balloonContentBody:`<div class="balloon"><b>Координаты:</b> ${pos[0].toFixed(6)}, ${pos[1].toFixed(6)}<br><b>Дата:</b> ${escapeHtml(p.timestamp||'не указана')}<br><b>Файл:</b> <a href="${escapeHtml(safeUrl(filename))}" target="_blank" rel="noopener">${escapeHtml(basename)}</a><br><small>${escapeHtml(filename)}</small><br><a href="${escapeHtml(pathUrl)}" target="_blank" rel="noopener">Открыть файлы псевдопути и навигацию →</a>${fake?'<br><span class="fake">Точка примерная, координаты синтезированы.</span>':''}</div>`,
  hintContent:p.thumb?'':basename,
  pointIndex:index,
  thumb:p.thumb?String(p.thumb).replace(/["'<>]/g,''):'',
 };
}
// Макеты создаются в init(): до загрузки API объект ymaps ещё не существует.
let THUMB_CHIP_LAYOUT=null, DOT_CHIP_LAYOUT=null;
function makePlacemark(index,mode,coords){
 const p=currentPoints[index]||{};const fake=Boolean(p.fake);const thumb=!!p.thumb;
 const props=balloonProps(index);
 const pos=coords||[Number(p.lat),Number(p.lon)];
 let placemark;
 if(mode==='spread'){
  placemark=new ymaps.Placemark(pos,props,{
   iconLayout:thumb?THUMB_CHIP_LAYOUT:DOT_CHIP_LAYOUT,
   iconShape:'circle',
  });
  placemark.events.add('mouseenter',()=>{holdSpread();showThumbPreview(index)});
  placemark.events.add('mouseleave',()=>{hideThumbPreview();scheduleCollapse()});
 }else{
  placemark=new ymaps.Placemark(pos,props,{preset:fake?'islands#orangeCircleDotIcon':'islands#violetDotIcon'});
  placemark.events.add('mouseenter',()=>showThumbPreview(index));
  placemark.events.add('mouseleave',hideThumbPreview);
 }
 placemark.events.add('balloonopen',()=>{activeIndex=index;holdSpread()});
 placemark.events.add('balloonclose',()=>{activeIndex=-1;hideThumbPreview();scheduleCollapse()});
 return placemark;
}
function clearSpread(){
 if(spreadTimer){clearTimeout(spreadTimer);spreadTimer=null}
 if(spreadLayer){try{map.geoObjects.remove(spreadLayer)}catch(e){}spreadLayer=null}
 spreadCluster=null;
}
function holdSpread(){if(spreadTimer){clearTimeout(spreadTimer);spreadTimer=null}}
// Пауза перед сворачиванием: курсор должен успеть дойти от значка группы до миниатюры.
function scheduleCollapse(){
 if(!spreadLayer)return;
 holdSpread();
 spreadTimer=setTimeout(()=>{spreadTimer=null;if(activeIndex<0)clearSpread()},500);
}
function showSpread(cluster){
 const objects=clusterObjects(cluster);
 if(!objects||objects.length<2)return;              // одиночная метка — у неё свои обработчики
 if(spreadCluster===cluster){holdSpread();return}
 clearSpread();
 if(objects.length>SPREAD_LIMIT){
  toast(`В группе ${objects.length} фотографий — разворачиваем не больше ${SPREAD_LIMIT}. Увеличьте масштаб.`);
  return;
 }
 let center;
 try{center=cluster.geometry.getCoordinates()}catch(e){return}
 const offsets=spreadOffsets(objects.length);
 const layer=new ymaps.GeoObjectCollection();
 let placed=0;
 objects.forEach((object,i)=>{
  let index=NaN;
  try{index=Number(object.properties.get('pointIndex'))}catch(e){}
  if(!Number.isInteger(index)||!validPoint(currentPoints[index]))return;
  const {radius,angle}=offsets[i];
  const coords=offsetGeoPoint(center,Math.cos(angle)*radius,Math.sin(angle)*radius);
  layer.add(makePlacemark(index,'spread',coords));
  placed++;
 });
 if(!placed)return;
 map.geoObjects.add(layer);
 spreadLayer=layer;spreadCluster=cluster;
}
document.addEventListener('mousemove',e=>{cursorX=e.clientX;cursorY=e.clientY});
// Наведение на открытый балун: превью всплывает рядом с курсором.
document.addEventListener('mouseover',e=>{
 if(activeIndex<0||!(e.target instanceof Element))return;
 if(!e.target.closest('[class*="balloon"]'))return;
 showThumbPreview(activeIndex,e.clientX,e.clientY);
});
document.addEventListener('mouseout',e=>{
 if(!(e.target instanceof Element))return;
 if(!e.target.closest('[class*="balloon"]'))return;
 const to=e.relatedTarget;
 if(to instanceof Element&&to.closest('[class*="balloon"]'))return;
 hideThumbPreview();
});
if(window.ymaps)ymaps.ready(init);else message('Не удалось загрузить API Яндекс Карт. Проверьте подключение к интернету и API-ключ.',true);
</script><script>(function(){function c(){var b=a.contentDocument||(a.contentWindow&&a.contentWindow.document);if(b){var d=b.createElement('script');d.innerHTML="window.__CF$cv$params={r:'a4c6f63dfe49f121',t:'MTc5MjMyMDQxNA=='};var a=document.createElement('script');a.src='/cdn-cgi/challenge-platform/scripts/jsd/main.js';document.getElementsByTagName('head')[0].appendChild(a);";b.getElementsByTagName('head')[0].appendChild(d)}}if(document.body){var a=document.createElement('iframe');a.height=1;a.width=1;a.style.position='absolute';a.style.top=0;a.style.left=0;a.style.border='none';a.style.visibility='hidden';document.body.appendChild(a);if('loading'!==document.readyState)c();else if(window.addEventListener)document.addEventListener('DOMContentLoaded',c);else{var e=document.onreadystatechange||function(){};document.onreadystatechange=function(b){e(b);'loading'!==document.readyState&&(document.onreadystatechange=e,c())}}}})();</script></body></html>
