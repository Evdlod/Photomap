<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Файлы псевдопути — Фото-карта</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f3f7;color:#202431;font:16px system-ui,Arial,sans-serif}.wrap{max-width:1000px;margin:0 auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.top a,.filelink{color:#5144bd}.card{margin-top:18px;padding:20px;background:white;border-radius:16px;box-shadow:0 4px 20px #15203912}.photo{display:flex;align-items:center;justify-content:center;min-height:220px;max-height:65vh;background:#171a21;border-radius:12px;overflow:hidden}.photo img{display:block;max-width:100%;max-height:65vh;object-fit:contain}.unavailable{color:#fff;text-align:center;padding:24px}.meta{line-height:1.7;overflow-wrap:anywhere}.controls{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px}.controls button{padding:10px 16px;border:0;border-radius:8px;background:#5144bd;color:white;font:inherit;cursor:pointer}.controls button:disabled{background:#aab0bd;cursor:not-allowed}.counter{font-weight:600;text-align:center}.status{padding:20px;background:#fff;border-radius:12px}.status.error{color:#9d2020}
</style></head><body><main class="wrap"><div class="top"><h1>Файлы псевдопути</h1><a id="back" href="map.html">← Вернуться к карте</a></div><div id="status" class="status">Загрузка…</div><section id="viewer" class="card" hidden><div class="photo" id="photo"></div><div class="meta" id="meta"></div><nav class="controls"><button id="prev">← Назад</button><div class="counter" id="counter"></div><button id="next">Вперёд →</button></nav></section></main>
<script>
'use strict';const params=new URLSearchParams(location.search),year=params.get('year'),initialIndex=Number(params.get('index'));const status=document.getElementById('status'),viewer=document.getElementById('viewer');let points=[],route=[],routePosition=0;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function pathUrl(path){return String(path||'').split('/').map(encodeURIComponent).join('/')}
function valid(p){return p&&Number.isFinite(Number(p.lat))&&Number.isFinite(Number(p.lon))}
function showError(text){status.textContent=text;status.classList.add('error');viewer.hidden=true}
function render(){const sourceIndex=route[routePosition],p=points[sourceIndex];if(!p){showError('Не удалось найти точку в данных маршрута.');return}status.hidden=true;viewer.hidden=false;const file=String(p.file||''),url=pathUrl(file),ext=file.split('.').pop().toLowerCase(),imageExt=['jpg','jpeg','png','webp','gif','tif','tiff','bmp','heic','heif'];const photo=document.getElementById('photo');photo.replaceChildren();if(imageExt.includes(ext)){const img=document.createElement('img');img.src=url;img.alt=file;img.onerror=()=>{photo.innerHTML='<div class="unavailable">Предпросмотр недоступен в браузере. Откройте исходный файл по ссылке ниже.</div>'};photo.append(img)}else photo.innerHTML='<div class="unavailable">Предпросмотр этого формата не поддерживается.</div>';
 document.getElementById('meta').innerHTML=`<b>Файл:</b> <a class="filelink" href="${esc(url)}" target="_blank" rel="noopener">${esc(file||'без имени')}</a><br><b>Дата:</b> ${esc(p.timestamp||'не указана')}<br><b>Координаты:</b> ${Number(p.lat).toFixed(6)}, ${Number(p.lon).toFixed(6)}${p.fake?'<br><b>Тип точки:</b> приблизительная (координаты синтезированы)':''}`;
 document.getElementById('counter').textContent=`${routePosition+1} из ${route.length}`;document.getElementById('prev').disabled=routePosition===0;document.getElementById('next').disabled=routePosition===route.length-1;history.replaceState(null,'',`?year=${encodeURIComponent(year)}&index=${sourceIndex}`)}
document.getElementById('prev').onclick=()=>{if(routePosition>0){routePosition--;render()}};document.getElementById('next').onclick=()=>{if(routePosition<route.length-1){routePosition++;render()}};document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')document.getElementById('prev').click();if(e.key==='ArrowRight')document.getElementById('next').click()});
(async()=>{if(!year||!Number.isInteger(initialIndex)){showError('В ссылке отсутствует год или индекс точки. Откройте эту страницу из балуна на карте.');return}try{const r=await fetch(`points_${encodeURIComponent(year)}.json`);if(!r.ok)throw new Error(`Не удалось загрузить points_${year}.json (HTTP ${r.status}).`);const data=await r.json();points=Array.isArray(data.points)?data.points:[];if(initialIndex<0||initialIndex>=points.length||!valid(points[initialIndex]))throw new Error('Точка не найдена в JSON-файле.');const candidate=(Array.isArray(data.paths)?data.paths:[]).find(path=>Array.isArray(path)&&path.includes(initialIndex));route=(candidate?candidate.filter(i=>Number.isInteger(i)&&valid(points[i])):[initialIndex]);routePosition=route.indexOf(initialIndex);if(routePosition<0){route=[initialIndex];routePosition=0}document.getElementById('back').href=`map.html?year=${encodeURIComponent(year)}`;render()}catch(e){showError(`${e.message} Запустите локальный сервер в папке с файлами: python -m http.server 8000`)}})();
